[tool.poetry]
name = "solar-system"
version = "0.1.0"
description = "Interactive 2D Keplerian solar system orbital simulation in Python and Pygame"
authors = ["Favur <hello@favur.dev>"]
packages = [{include = "solar_system", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pygame = ">=2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=5.0.0"
ruff = ">=0.6.0"
mypy = ">=1.11.0"

[tool.poetry.scripts]
solar-system = "solar_system.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "conftest.py"]

[tool.coverage.run]
source = ["solar_system"]
omit = ["src/solar_system/renderer.py", "src/solar_system/main.py"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["solar_system"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
